server {
    listen 80;
    listen [::]:80;
    server_name k15c106.p.ssafy.io;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name k15c106.p.ssafy.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/k15c106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15c106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /jenkins {
        return 301 /jenkins/;
    }

    location /jenkins/ {
        proxy_pass http://jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 100m;
    }

    # 백엔드 API (/api/v1/...). 경로를 바꾸지 않고 그대로 backend:8080에 넘긴다.
    # /actuator, /swagger-ui.html 은 /api 밑이 아니므로 여기로 안 오고, 바깥에 열리지 않는다.
    location /api/ {
        # Docker 내부 DNS로 매번 이름을 찾는다. backend가 재시작 중이어도 nginx는 죽지 않고 502만 낸다.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Agent 스트리밍(결정 13): 응답을 모아 두지 않고 글자가 나오는 대로 흘려보낸다. 긴 응답 대비 읽기 대기 5분.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        client_max_body_size 20m;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
