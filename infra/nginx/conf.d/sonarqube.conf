server {
    listen 80;
    listen [::]:80;
    server_name sonar.ontologenie.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sonar.ontologenie.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/sonar.ontologenie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sonar.ontologenie.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $sonarqube_upstream http://sonarqube:9000;
        proxy_pass $sonarqube_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
