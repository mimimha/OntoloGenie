services:
  nginx:
    image: nginx:1.30
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - axcore-net

  certbot:
    image: certbot/certbot:v4.1.1
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  jenkins:
    build: ./jenkins
    image: axcore-jenkins:2.580.1
    container_name: jenkins
    restart: unless-stopped
    # 5-0c: MR 검사(gradle 빌드·테스트)가 이 컨테이너 안에서 돈다. 2026-11-01 실측: 평소 0.9GiB, gradle 전체 빌드·테스트 중 최고 2.0GiB → 4g면 여유 2배.
    mem_limit: 4g
    cpus: 2.0
    environment:
      JENKINS_OPTS: "--prefix=/jenkins"
      JAVA_OPTS: "-Xmx2g -Duser.timezone=Asia/Seoul"
      # MR 검사용 gradle 힙 상한. mem_limit 안에 들어가야 컨테이너가 죽지 않는다.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g"
      # 테스트용 PostgreSQL(Testcontainers)은 기본 bridge에 뜨고 서버 포트로 열린다. 이 컨테이너에서는 axcore-net 게이트웨이(=서버)로 닿는다.
      # 값 확인: docker network inspect axcore-net -f '{{(index .IPAM.Config 0).Gateway}}' (2026-10-30 실측 172.18.0.1, curl 200 확인)
      TESTCONTAINERS_HOST_OVERRIDE: "172.18.0.1"
    group_add:
      - "988"
    volumes:
      - ./jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # 배포용: 가게 폴더를 같은 주소로 연결. Jenkins가 compose.yaml·.env를 읽고 BACKEND_TAG를 갱신한다.
      - /home/ubuntu/axcore:/home/ubuntu/axcore
    networks:
      - axcore-net

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-data-18:/var/lib/postgresql
    networks:
      - axcore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 플랫폼 백엔드 (Spring Boot, api 모드). 이미지 태그는 .env의 BACKEND_TAG (= 커밋 SHA).
  # 같은 이미지를 batch 모드로 한 번 더 띄우는 건 6-6(ERP·MES 접속 정보) 뒤에 추가한다.
  backend:
    image: axcore-backend:${BACKEND_TAG}
    container_name: backend
    restart: unless-stopped
    mem_limit: 2g
    environment:
      SPRING_PROFILES_ACTIVE: api
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: Asia/Seoul
      # 첫 관리자 계정 (관리자가 없을 때 한 번만 사용). 값은 서버 .env에만. 비어 있으면 경고 로그만 남긴다.
      AXCORE_INITIAL_ADMIN_LOGIN_ID: ${AXCORE_INITIAL_ADMIN_LOGIN_ID:-}
      AXCORE_INITIAL_ADMIN_PASSWORD: ${AXCORE_INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - axcore-net
    # 컨테이너 안에서 자기 문(8080)을 두드린다. DB까지 포함한 전체 상태라 DB가 죽으면 unhealthy가 된다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # 플랫폼 프론트 (React 정적 파일을 컨테이너 안 nginx가 서빙, frontend/Dockerfile). 이미지 태그는 .env의 FRONTEND_TAG (= 커밋 SHA).
  # 바깥 손님은 메인 nginx(443)의 / 를 거쳐 들어온다. 10080은 서버 안 디버그용 (포트 규칙: 1 + 컨테이너 기본 포트. 13000은 grafana 예정).
  frontend:
    image: axcore-frontend:${FRONTEND_TAG}
    container_name: frontend
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:10080:80"
    networks:
      - axcore-net
    # 컨테이너 안에서 자기 문(80)을 두드린다. 응답 없으면 unhealthy. nginx:alpine에는 wget(busybox)이 들어 있다.
    # 주소는 localhost가 아니라 127.0.0.1: 알파인에서 localhost는 IPv6(::1)로 먼저 풀리는데 컨테이너 nginx는 IPv4만 듣는다 (2026-11-01 unhealthy 원인).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 내부 AI 서비스. 이미지 태그는 서버 .env의 AI_TAG로 관리한다.
  ai:
    image: axcore-ai:${AI_TAG}
    container_name: ai
    restart: unless-stopped
    # 시작값이며 배포 후 실측해 조정한다.
    mem_limit: 1g
    environment:
      AI_ONTOLOGY_BACKEND_URL: http://backend:8080
      AI_ONTOLOGY_LLM_PROVIDER: ${AI_ONTOLOGY_LLM_PROVIDER:-gms}
      AI_ONTOLOGY_LLM_API_KEY: ${AI_ONTOLOGY_LLM_API_KEY:-}
      AI_ONTOLOGY_LLM_BASE_URL: ${AI_ONTOLOGY_LLM_BASE_URL:-}
      AI_ONTOLOGY_LLM_MODEL: ${AI_ONTOLOGY_LLM_MODEL:-}
      AI_ONTOLOGY_LLM_TIMEOUT_SEC: ${AI_ONTOLOGY_LLM_TIMEOUT_SEC:-60}
      AI_ONTOLOGY_INTERNAL_TOKEN: ${AI_ONTOLOGY_INTERNAL_TOKEN:-}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - axcore-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  axcore-net:
    name: axcore-net

volumes:
  pg-data-18:
    name: axcore-pg-data-18
