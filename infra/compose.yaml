services:
  nginx:
    image: nginx:1.30
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - axcore-net

  certbot:
    image: certbot/certbot:v4.1.1
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  jenkins:
    build: ./jenkins
    image: axcore-jenkins:2.580.1
    container_name: jenkins
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    environment:
      JENKINS_OPTS: "--prefix=/jenkins"
      JAVA_OPTS: "-Xmx2g -Duser.timezone=Asia/Seoul"
    group_add:
      - "988"
    volumes:
      - ./jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - axcore-net

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-data-18:/var/lib/postgresql
    networks:
      - axcore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 플랫폼 백엔드 (Spring Boot, api 모드). 이미지 태그는 .env의 BACKEND_TAG (= 커밋 SHA).
  # 같은 이미지를 batch 모드로 한 번 더 띄우는 건 6-6(ERP·MES 접속 정보) 뒤에 추가한다.
  backend:
    image: axcore-backend:${BACKEND_TAG}
    container_name: backend
    restart: unless-stopped
    mem_limit: 2g
    environment:
      SPRING_PROFILES_ACTIVE: api
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: Asia/Seoul
      # 첫 관리자 계정 (관리자가 없을 때 한 번만 사용). 값은 서버 .env에만. 비어 있으면 경고 로그만 남긴다.
      AXCORE_INITIAL_ADMIN_LOGIN_ID: ${AXCORE_INITIAL_ADMIN_LOGIN_ID:-}
      AXCORE_INITIAL_ADMIN_PASSWORD: ${AXCORE_INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - axcore-net
    # 컨테이너 안에서 자기 문(8080)을 두드린다. DB까지 포함한 전체 상태라 DB가 죽으면 unhealthy가 된다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  axcore-net:
    name: axcore-net

volumes:
  pg-data-18:
    name: axcore-pg-data-18
