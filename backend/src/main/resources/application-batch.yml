# 배치 컨테이너는 웹 서버 없이 실행하고, 스케줄 작업을 위해 프로세스를 유지한다.
spring:
  main:
    web-application-type: none
    keep-alive: true
  # 끄는 신호를 받으면 처리 중인 작업이 끝나기를 잠깐 기다린다. 그 안에 못 끝난 작업은 RUNNING으로 남는다.
  task:
    scheduling:
      # 주기 작업이 서로 기다리지 않게 스레드를 나눈다(S15P31C106-218). 전체 읽기(pollSyncRuns), 그 밖의 작업(poll), 멈춘 작업 정리,
      # 분석 시간 초과 정리, 수집 뒤 검사 넣기(SyncCheckJob), CDC 다시 읽기 감시(CdcReloadJob), 전체 읽기 heartbeat가 각자 스레드를
      # 쓴다(7개 + 여유 1개). CDC 소비 루프는 전용 스레드라 여기에 들지 않는다. 주기 작업을 더하면 이 수도 함께 본다.
      pool:
        size: 8
      shutdown:
        await-termination: true
        await-termination-period: 30s

axcore:
  batch:
    # 작업 표에서 QUEUED 행을 확인하는 간격(QueuedJobPoller). 한 번에 작업 종류마다 최대 20건을 처리한다. 전체 읽기는 따로 한 번에 1건이다.
    poll-delay: 2s
    # 멈춘 작업(RUNNING인 채 남은 행)을 시간 초과로 FAILED 처리하는 기준과 확인 간격(StaleJobCleanupJob, S15P31C106-218).
    timeout-check-delay: 1m
    timeout:
      # sync_run: 실행 틀이 heartbeat마다 heartbeat_at을 올리고, sync-run 동안 갱신이 없으면 멈춘 것으로 본다(11-09 이주헌과 합의).
      # 원천 쿼리 하나는 statement_timeout 5분으로 끊기지만 실행 전체는 5분을 넘을 수 있다. heartbeat는 별도 스레드라 영향이 없다.
      heartbeat: 30s
      sync-run: 5m
      # 아래는 heartbeat 칸이 없어 시작 시각부터 잰다. 2026-11-09 이 값으로 정했다(김산이, U3). 실제 소요 시간을 잰 뒤 바꿀 수 있다.
      # 연결 검사·미리보기: 원천 접속 10초, 카탈로그 쿼리 30초, 소켓 60초를 계정 두 개에 써도 몇 분 안에 끝난다.
      source-check: 10m
      source-preview: 10m
      # 정합성 검사: 아직 Handler가 없다. 넉넉히 잡고 실제 소요 시간을 잰 뒤 줄인다.
      check-run: 30m
  # 원천 표본(016)·매핑 미리보기(040) 결과는 원천 값이 들어 있어 요청 1시간 뒤(expires_at) 지운다. 지난 행을 찾는 간격(SourcePreviewCleanupJob).
  source-preview:
    cleanup-delay: 10m
  # CDC 소비 루프(198-6). 원천 토픽({data_source.code}.all)마다 전용 스레드의 KafkaConsumer가 cdc_offset 위치부터 읽는다.
  # 켜는 것은 배포 설정(AXCORE_CDC_CONSUMER_ENABLED)으로 한다. 꺼져 있으면 소비자를 하나도 띄우지 않는다.
  cdc:
    consumer:
      enabled: ${AXCORE_CDC_CONSUMER_ENABLED:false}
      # 배치·backend와 Kafka는 같은 axcore-net에 있다(infra/cdc/compose.yaml).
      bootstrap-servers: ${AXCORE_CDC_BOOTSTRAP_SERVERS:kafka:9092}
      poll-timeout: 1s
      # 원천 트랜잭션 하나의 변경 수 상한. 넘으면 그 원천을 복구(TRANSACTION_TOO_LARGE)로 돌린다.
      max-events: 50000
      # 받은 메시지의 시각(heartbeat·변경 처리 시각)보다 이만큼 늦게 처리하면 수집 비정상(healthy_since = NULL)으로 본다.
      max-lag: 2m
      # 커넥터 heartbeat(60초)가 이만큼 없으면 수집 비정상으로 본다.
      stale-after: 3m
      # 처리 장애 뒤 같은 위치부터 다시 시도하기까지 기다리는 시간.
      retry-delay: 5s
      # 소비할 원천(CDC 표가 있는 원천)을 다시 찾는 간격, 복구 중인 원천이 풀렸는지 확인하는 간격.
      refresh-interval: 30s
  check:
    # 원천 사이 규칙의 미연결을 확인 대기(link_check_pending)에 두는 시간(191-3). 원천이 정상인 채로 이만큼 지나도 안 맞으면 issue로 올린다.
    # 기본값은 임시이고 246에서 확정한다.
    pending-wait: 10m
    sync:
      # 반영 중인 규칙 전부를 검사하는 SYNC를 넣는 주기(191-4, SyncCheckJob). 같은 데이터 기준이면 성공한 SYNC를 다시 쓰고 새로 넣지 않는다.
      # 끄려면 배포 설정 AXCORE_CHECK_SYNC_ENABLED=false.
      enabled: ${AXCORE_CHECK_SYNC_ENABLED:true}
      interval: 5m
